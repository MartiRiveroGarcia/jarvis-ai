# Alembic configuration for the Jarvis backend.
#
# The database URL is intentionally NOT set here: alembic/env.py reads it from
# the application Settings (DATABASE_URL), so the app and migrations always
# target the same database.

[alembic]
script_location = %(here)s/alembic

# Make the `app` package importable regardless of the working directory.
prepend_sys_path = %(here)s
path_separator = os

# Date-prefixed migration file names, e.g. 20261004_ab12cd34ef56_create_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Keep generated migrations consistent with the project's Ruff configuration.
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging configuration, consumed by alembic/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
